<!doctype html><meta charset="utf-8"><body style="margin:0;background:#000"><canvas id="c" width="1920" height="1080"></canvas>
<script src="lib2d.js"></script><script src="char2d.js"></script><script src="body2d.js"></script><script src="fullbody.js"></script><script src="bgstreet.js"></script><script src="bgneon.js"></script><script src="light2d.js"></script><script>
const X=document.getElementById('c').getContext('2d');
bgStreet(X);
// warm light around Him spilling on the wet street + its reflection
glow(X,1300,560,420,'rgba(255,200,120,A)',.55); X.save(); X.globalCompositeOperation='lighter'; const g=X.createLinearGradient(0,770,0,1080); g.addColorStop(0,'rgba(255,200,120,.55)'); g.addColorStop(1,'rgba(255,200,120,0)'); X.filter='blur(18px)'; X.fillStyle='rgba(255,200,120,.35)'; X.beginPath(); X.ellipse(1300,790,260,40,0,0,7); X.fill(); X.filter='blur(8px)'; X.fillStyle=g; X.fillRect(1262,780,76,300); X.restore();
// Jesus (mid-ground), walking toward the young person, hand reaching out
const J=mkLayer(), JC=J.getContext('2d'), SJ=26;
drawHead(JC,{cx:1300,cy:330,S:SJ,yaw:.3,beard:true,lookX:-.6,lookY:.4,smile:.5,body:(v,P)=>jesusFull(JC,v,P,SJ,{reach:.8,reachSide:-1})});
lightLayer(J,{ambient:'#d8c8f0',ambientK:.25,key:[1260,420,300,'rgba(255,220,170,1)',.5],rims:[{dx:4,dy:0,col:'rgba(255,230,180,1)',a:.9},{dx:-4,dy:0,col:'rgba(255,214,150,1)',a:.6}]});
glow(X,1300,330,160,'rgba(255,236,190,A)',.5); X.drawImage(J,0,0);
// the young person on the kerb, foreground, head bowed, cool light with a warm rim from His side
const Y=mkLayer(), YC=Y.getContext('2d'), SY=118;
drawHead(YC,{cx:430,cy:700,S:SY,yaw:-.42,pitch:.32,hair:'short',chinK:.82,eyeK:1.18,eyeH:1.12,iris:['#101a2e','#2c4a7a','#8fb6e8'],lookX:.3,lookY:1,sad:true,neckK:.8,tear:true,body:(v,P)=>hoodieBody(YC,v,P,SY)});
lightLayer(Y,{ambient:'#6f78c8',ambientK:.55,shade:[700,250,'rgba(20,20,70,1)',.5],key:[800,640,560,'rgba(255,200,140,1)',.3],rims:[{dx:-7,dy:1,col:'rgba(255,200,130,1)',a:.9,mask:[[260,0,820,0],[[0,'rgba(0,0,0,0)'],[.5,'rgba(0,0,0,1)'],[1,'rgba(0,0,0,1)']]]}]});
X.drawImage(Y,0,0);
fgRain(X,90); [[1180,250,16],[1420,300,12],[1250,180,10]].forEach(s=>star4(X,...s,.85)); grade(X);
</script>
