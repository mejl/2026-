<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
const SCH = __SCHEDULE__;
const cv = document.getElementById('c'); let X = cv.getContext('2d');
const W = 1280, H = 720, TAU = Math.PI * 2;
const KANJI = ['', '一','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五','十六'];
const ROMAN = ['', 'I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI'];

// ---------- utils ----------
function hash(i){ let t = (i * 2654435761 + 0x6D2B79F5) >>> 0; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const clamp = (v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease = x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const smooth = (a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t);};
const lerp=(a,b,t)=>a+(b-a)*t;
function grad(stops, y0=0, y1=H){ const g = X.createLinearGradient(0,y0,0,y1); stops.forEach((c,i)=>g.addColorStop(i/(stops.length-1),c)); return g; }
var sky=function(stops){ X.fillStyle = grad(stops); X.fillRect(-50,-50,W+100,H+100); }
function glow(x,y,r,col,a=1){ const g=X.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,col); g.addColorStop(1,'rgba(0,0,0,0)'); X.globalAlpha=a; X.fillStyle=g; X.fillRect(x-r,y-r,2*r,2*r); X.globalAlpha=1; }
function disc(x,y,r,col){ X.fillStyle=col; X.beginPath(); X.arc(x,y,r,0,TAU); X.fill(); }
function stars(n, seed, t, a=1, ymax=H){ for(let i=0;i<n;i++){ const x=hash(seed+i*3)*W, y=hash(seed+i*3+1)*ymax, s=hash(seed+i*3+2); const tw=.5+.5*Math.sin(t*(1+s*3)+i); X.globalAlpha=a*(.3+.7*tw)*(.4+s*.6); X.fillStyle='#fff'; X.fillRect(x,y,s>.93?2.4:1.3,s>.93?2.4:1.3); if(s>.975){ X.globalAlpha=a*tw*.6; X.fillRect(x-6,y+1,14,.8); X.fillRect(x+1,y-6,.8,14);} } X.globalAlpha=1; }
function rays(x,y,n,t,col,a,len=1400,spread=1){ X.save(); X.translate(x,y); X.globalCompositeOperation='lighter'; for(let i=0;i<n;i++){ const ang=(i/n)*TAU*spread+t*.05+hash(i)*.3; const w=.02+hash(i+50)*.05; X.globalAlpha=a*(.3+.7*(.5+.5*Math.sin(t*.8+i*1.7))); const g=X.createLinearGradient(0,0,Math.cos(ang)*len,Math.sin(ang)*len); g.addColorStop(0,col); g.addColorStop(1,'rgba(0,0,0,0)'); X.fillStyle=g; X.beginPath(); X.moveTo(0,0); X.lineTo(Math.cos(ang-w)*len,Math.sin(ang-w)*len); X.lineTo(Math.cos(ang+w)*len,Math.sin(ang+w)*len); X.fill(); } X.restore(); X.globalAlpha=1; }
var ridge=function(seed, base, amp, col, rough=1, sharp=false){ X.fillStyle=col; X.beginPath(); X.moveTo(-60,H+60); for(let x=-60;x<=W+60;x+=8){ let y=base; for(let k=1;k<=4;k++){ y-= amp/k*Math.sin(x*.004*k*rough + hash(seed+k)*TAU); } if(sharp) y-= amp*.35*Math.abs(Math.sin(x*.013+seed)); X.lineTo(x,y);} X.lineTo(W+60,H+60); X.fill(); }
function haze(y,h,col,a){ X.globalAlpha=a; X.fillStyle=grad(['rgba(0,0,0,0)',col,'rgba(0,0,0,0)'],y,y+h); X.fillRect(0,y,W,h); X.globalAlpha=1; }
function particles(kind, t, n, seed, a=1){
  for(let i=0;i<n;i++){
    const s=hash(seed+i), s2=hash(seed+i+999), s3=hash(seed+i+1777);
    let x,y,sz,col;
    if(kind==='ember'){ const sp=40+s2*90; y=H+20-((t*sp+s3*H*1.4)%(H*1.4)); x=s*W+Math.sin(t*1.3+i)*30; sz=1+s3*2.5; col='255,'+(120+(s2*100|0))+',40'; }
    else if(kind==='rain'){ const sp=900+s2*500; y=((t*sp+s3*H*1.2)%(H*1.2))-60; x=(s*W*1.3-t*250*(.8+s2*.4))%(W*1.3); if(x<0)x+=W*1.3; X.strokeStyle='rgba(180,200,255,'+(.25*a)+')'; X.lineWidth=1; X.beginPath(); X.moveTo(x,y); X.lineTo(x-7,y+22); X.stroke(); continue; }
    else if(kind==='dust'){ x=(s*W+t*(10+s2*25))%W; y=s3*H+Math.sin(t*.7+i)*20; sz=.8+s2*1.8; col='255,230,190'; }
    else if(kind==='sparkle'){ x=s*W+Math.sin(t*.5+i)*40; y=(s3*H - t*(12+s2*20)+H*2)%H; sz=1+s2*2; col='255,250,220'; }
    else if(kind==='petal'){ x=(s*W*1.2+t*(40+s2*40))%(W*1.2)-60; y=(s3*H+t*(30+s2*30))%(H+40)-20; X.save(); X.translate(x,y); X.rotate(t*2+i); X.globalAlpha=a*.85; X.fillStyle='#ffd1e0'; X.beginPath(); X.ellipse(0,0,5,2.6,0,0,TAU); X.fill(); X.restore(); continue; }
    else if(kind==='flame'){ const sp=120+s2*160; y=((t*sp+s3*H*1.3)%(H*1.3))-80; x=s*W+Math.sin(t*2+i)*25; sz=3+s3*6; col='255,'+(140+(s2*90|0))+',60'; }
    X.globalAlpha=a*(.4+.6*s3); X.fillStyle='rgba('+col+',1)'; X.beginPath(); X.arc(x,y,sz,0,TAU); X.fill();
    if(kind==='ember'||kind==='flame'||kind==='sparkle'){ glow(x,y,sz*5,'rgba('+col+',.5)',a*.5); }
  }
  X.globalAlpha=1;
}
// anime-style silhouette figure with flowing cloak + rim light
var figure=function(x,y,h,t,o={}){
  const col=o.col||'#07070d', rim=o.rim||null, pose=o.pose||'stand', dir=o.dir||1, sway=Math.sin(t*2.2+(o.ph||0));
  X.save(); X.translate(x,y); X.scale(dir*h/100,h/100);
  // cloak
  X.fillStyle=col; X.beginPath(); X.moveTo(-9,-72); X.quadraticCurveTo(-16,-30,-22-sway*4,0); X.lineTo(20+sway*6,0);
  X.quadraticCurveTo(26+sway*10,-30,10,-72); X.closePath(); X.fill();
  // flowing cape tail
  X.beginPath(); X.moveTo(8,-70); X.bezierCurveTo(30+sway*6,-60,44+sway*12,-30,58+sway*16,-12+sway*4); X.lineTo(22,-8); X.closePath(); X.fill();
  // head + hair spikes
  X.beginPath(); X.arc(0,-82,9.5,0,TAU); X.fill();
  X.beginPath(); X.moveTo(-9,-88); X.lineTo(-16-sway*2,-80); X.lineTo(-8,-84); X.lineTo(-13,-74); X.lineTo(-3,-82); X.fill();
  // arms
  X.strokeStyle=col; X.lineWidth=6.5; X.lineCap='round'; X.beginPath();
  if(pose==='arms'){ X.moveTo(-6,-66); X.lineTo(-24,-100); X.moveTo(6,-66); X.lineTo(24,-100); }
  else if(pose==='staff'){ X.moveTo(6,-64); X.lineTo(18,-50); X.moveTo(-6,-64); X.lineTo(-14,-44); }
  else if(pose==='sling'){ X.moveTo(6,-64); X.lineTo(30+Math.sin(t*14)*10,-92+Math.cos(t*14)*10); X.moveTo(-6,-64); X.lineTo(-18,-46); }
  else if(pose==='kneel'){ X.moveTo(6,-60); X.lineTo(14,-78); X.moveTo(-6,-60); X.lineTo(-12,-78); }
  else { X.moveTo(6,-64); X.lineTo(12,-40); X.moveTo(-6,-64); X.lineTo(-12,-40); }
  X.stroke();
  if(pose==='staff'){ X.lineWidth=3; X.beginPath(); X.moveTo(19,-118); X.lineTo(19,2); X.stroke(); }
  if(rim){ X.strokeStyle=rim; X.lineWidth=1.6; X.globalAlpha=.9; X.beginPath(); X.arc(0,-82,9.5,-1.9,-.2); X.stroke(); X.beginPath(); X.moveTo(10,-72); X.quadraticCurveTo(26+sway*10,-30,20+sway*6,0); X.stroke(); X.globalAlpha=1; }
  X.restore();
}
var crowd=function(x0,x1,y,h,t,walk,col,n,seed){ for(let i=0;i<n;i++){ const s=hash(seed+i); const x=lerp(x0,x1,i/n)+s*20+(walk?t*walk:0); const hh=h*(.7+s*.4); figure(((x%(W+200))+W+200)%(W+200)-100,y+s*10,hh,t,{col,ph:i,pose:s>.8?'staff':'stand'}); } }
function speedLines(cx,cy,t,a,col='255,255,255'){ X.save(); X.globalCompositeOperation='lighter'; for(let i=0;i<90;i++){ const ang=hash(i*7+Math.floor(t*12))*TAU; const r0=180+hash(i*13)*220, r1=900; X.strokeStyle='rgba('+col+','+(a*(.2+hash(i)*.6))+')'; X.lineWidth=.8+hash(i*5)*2.5; X.beginPath(); X.moveTo(cx+Math.cos(ang)*r0,cy+Math.sin(ang)*r0); X.lineTo(cx+Math.cos(ang)*r1,cy+Math.sin(ang)*r1); X.stroke(); } X.restore(); }
function flash(a,col='#fff'){ if(a<=0)return; X.globalAlpha=clamp(a); X.fillStyle=col; X.fillRect(-50,-50,W+100,H+100); X.globalAlpha=1; }
function lensFlare(x,y,a){ X.save(); X.globalCompositeOperation='lighter'; const dx=W/2-x, dy=H/2-y; [[.3,30,'255,200,120'],[.6,14,'120,200,255'],[.9,50,'255,140,90'],[1.3,22,'200,255,200'],[1.7,70,'255,220,160']].forEach(([k,r,c])=>glow(x+dx*k*1.2,y+dy*k*1.2,r,'rgba('+c+',.35)',a)); X.fillStyle='rgba(255,240,210,'+(.25*a)+')'; X.fillRect(0,y-1.5,W,3); X.restore(); }
function water(y,t,c1,c2,amp=6){ X.fillStyle=grad([c1,c2],y,H); X.beginPath(); X.moveTo(-10,H); for(let x=-10;x<=W+10;x+=10){ X.lineTo(x,y+Math.sin(x*.02+t*1.6)*amp+Math.sin(x*.047-t*2.3)*amp*.5);} X.lineTo(W+10,H); X.fill(); X.strokeStyle='rgba(255,255,255,.18)'; X.lineWidth=1; for(let k=0;k<14;k++){ const yy=y+18+k*k*2.4; X.beginPath(); for(let x=0;x<=W;x+=14){ const v=yy+Math.sin(x*.03+t*2+k)*2; x?X.lineTo(x,v):X.moveTo(x,v);} X.globalAlpha=.5-k*.03; X.stroke(); } X.globalAlpha=1; }
function city(base,col,seed,n=26,maxh=120,domes=true){ X.fillStyle=col; for(let i=0;i<n;i++){ const w=30+hash(seed+i)*50, x=i*(W/n)-10+hash(seed+i+5)*20, h=30+hash(seed+i+9)*maxh; X.fillRect(x,base-h,w,h+2); if(domes&&hash(seed+i+13)>.7){ X.beginPath(); X.arc(x+w/2,base-h,w/2.4,Math.PI,0); X.fill(); } if(hash(seed+i+21)>.6){ X.fillRect(x+w*.4,base-h-24,w*.2,24);} } }
function cross(x,y,s,col){ X.fillStyle=col; X.fillRect(x-s*.06,y-s,s*.12,s); X.fillRect(x-s*.32,y-s*.78,s*.64,s*.11); }

// ---------- chapter card ----------
function chapterCard(s,lt){
  const d=s.card, p=lt/d, idx=ROMAN.indexOf(s.ch);
  X.fillStyle='#050408'; X.fillRect(0,0,W,H);
  // diagonal slash of light
  const sx=lerp(-400,W+400,ease(clamp(p*1.6)));
  X.save(); X.globalCompositeOperation='lighter'; X.translate(sx,H/2); X.rotate(-.35);
  const g=X.createLinearGradient(-120,0,120,0); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(.5,'rgba(255,190,90,.85)'); g.addColorStop(1,'rgba(0,0,0,0)');
  X.fillStyle=g; X.fillRect(-120,-900,240,1800); X.restore();
  speedLines(W/2,H/2,lt,.25*smooth(0,.3,p),'255,200,120');
  // big kanji ghost
  X.save(); X.globalAlpha=.12*smooth(.05,.4,p); X.fillStyle='#d4a437'; X.font='bold 360px serif'; X.textAlign='center'; X.textBaseline='middle';
  X.fillText('第'+KANJI[idx]+'章', W/2+lerp(60,-60,p), H/2+10); X.restore();
  const a=smooth(.18,.4,p)*(1-smooth(.85,1,p));
  X.textAlign='center'; X.globalAlpha=a;
  X.fillStyle='#d4a437'; X.font='600 22px Georgia, serif'; X.save(); X.translate(W/2,H/2-78); X.fillText(('CHAPTER  '+s.ch).split('').join(String.fromCharCode(8202)), 0,0); X.restore();
  const sc=lerp(1.25,1,ease(smooth(.18,.5,p)));
  X.save(); X.translate(W/2,H/2+10); X.scale(sc,sc); X.fillStyle='#fff'; X.shadowColor='rgba(255,170,60,.9)'; X.shadowBlur=30; X.font='bold 88px Georgia, serif'; const tw=X.measureText(s.title).width; if(tw>1080){ const k=1080/tw; X.scale(k,k);} X.fillText(s.title,0,0); X.restore();
  X.fillStyle='#b9bdd0'; X.font='italic 24px Georgia, serif'; X.fillText(s.sub, W/2, H/2+70);
  X.globalAlpha=1; flash(1-smooth(0,.12,p),'#fff');
}

// ---------- scenes ----------
const SCENES = {
intro(lt,d){ const p=lt/d; sky(['#000','#07061a','#120a24']); stars(260,11,lt,smooth(0,.5,p));
  // particles gathering into light
  X.save(); X.globalCompositeOperation='lighter'; for(let i=0;i<220;i++){ const a=hash(i)*TAU, r=lerp(700,0,ease(clamp(p*1.1-hash(i+3)*.25))); glow(W/2+Math.cos(a+lt*.2)*r,H/2+Math.sin(a+lt*.2)*r*.6,5,'rgba(255,210,140,.9)',.8);} X.restore();
  glow(W/2,H/2,lerp(10,420,ease(p)),'rgba(255,220,160,.9)',p); rays(W/2,H/2,28,lt,'rgba(255,220,160,.5)',smooth(.5,1,p));
  X.globalAlpha=smooth(.55,.8,p); X.textAlign='center'; X.fillStyle='#fff'; X.shadowColor='#ffb347'; X.shadowBlur=40; X.font='bold 78px Georgia, serif'; X.fillText('FROM EDEN TO ETERNITY',W/2,H/2+30); X.shadowBlur=0;
  X.font='italic 28px Georgia, serif'; X.fillStyle='#e8c77a'; X.fillText('The Bible, History, and the Return of the King',W/2,H/2+90); X.globalAlpha=1; },
c1(lt,d){ const p=lt/d;
  if(p<.45){ const q=p/.45; sky(['#000','#0a0620',lerp(0,1,q)>.5?'#3b1d4a':'#12081f']); stars(300,21,lt,1);
    const bx=W/2, by=H*.55; glow(bx,by,lerp(20,900,ease(q)),'rgba(255,240,200,1)',smooth(0,.3,q)); rays(bx,by,40,lt,'rgba(255,230,180,.6)',smooth(.1,.5,q));
    speedLines(bx,by,lt,.5*(1-q)); ridge(3,H*.82,40,'#0b0714',1); water(H*.84,lt,'#1b2a4a','#050a14');
    flash(1-smooth(0,.06,q)); }
  else if(p<.72){ const q=(p-.45)/.27; sky(['#6fb6ff','#bfe6ff','#ffe9c4']); disc(W*.78,H*.25,55,'#fff8e0'); glow(W*.78,H*.25,300,'rgba(255,240,200,.7)'); lensFlare(W*.78,H*.25,.6);
    ridge(5,H*.62,50,'#7aa8c8',.8); ridge(6,H*.72,40,'#3e7a5a',1.2); ridge(7,H*.82,25,'#24583a',1.6);
    // garden tree
    X.fillStyle='#1f3d24'; X.fillRect(W*.3-8,H*.58,16,H*.25); disc(W*.3,H*.55,80,'#2f6b3a'); disc(W*.3-50,H*.6,55,'#2a5f33'); disc(W*.3+55,H*.6,55,'#2a5f33'); for(let i=0;i<9;i++) disc(W*.3+Math.cos(i)*60,H*.55+Math.sin(i*2)*40,6,'#d33');
    figure(W*.55,H*.86,110,lt,{col:'#1b2230',rim:'#fff3c4'}); figure(W*.6,H*.86,100,lt,{col:'#1b2230',rim:'#fff3c4',ph:2,dir:-1}); particles('petal',lt,40,31); }
  else { const q=(p-.72)/.28; sky(['#0c0f16','#1c2433','#2c3547']); particles('rain',lt,260,41,1); ridge(8,H*.7,30,'#141a24');
    // lightning
    if(Math.sin(lt*3.1)>.97) flash(.35,'#cfe0ff');
    water(H*.66,lt,'#1c2a3c','#05080d',14);
    // ark
    const ax=lerp(W*.2,W*.45,q), ay=H*.64+Math.sin(lt*1.4)*6; X.save(); X.translate(ax,ay); X.rotate(Math.sin(lt*1.2)*.04); X.fillStyle='#3a2616'; X.beginPath(); X.moveTo(-190,-10); X.lineTo(190,-10); X.lineTo(150,40); X.lineTo(-150,40); X.fill(); X.fillStyle='#4d3320'; X.fillRect(-110,-60,220,52); X.fillStyle='#2b1c10'; X.beginPath(); X.moveTo(-125,-60); X.lineTo(0,-100); X.lineTo(125,-60); X.fill(); X.fillStyle='rgba(255,200,120,.8)'; X.fillRect(-20,-45,14,12); X.fillRect(30,-45,14,12); X.restore();
    water(H*.72,lt+1,'rgba(20,34,50,.85)','#05080d',10); }
},
c2(lt,d){ const p=lt/d; sky(['#02030c','#0b1030','#2a2150']); stars(700,51,lt,1,H*.8);
  // milky way band
  X.save(); X.translate(W/2,H*.35); X.rotate(-.3); X.globalCompositeOperation='lighter'; for(let i=0;i<500;i++){ const x=(hash(i+5000)-.5)*W*1.6, y=(hash(i+6000)-.5)*120*(1+Math.abs(x)/W); glow(x,y,6,'rgba(160,170,255,.25)',.5);} X.restore();
  // shooting stars
  for(let k=0;k<3;k++){ const tt=(lt*.35+k*.37)%1; if(tt<.25){ const sx=W*(.2+k*.3)+tt*900, sy=H*.1+tt*300; X.strokeStyle='rgba(255,255,255,.8)'; X.lineWidth=2; X.beginPath(); X.moveTo(sx,sy); X.lineTo(sx-120,sy-40); X.stroke(); glow(sx,sy,14,'rgba(255,255,255,.9)'); } }
  ridge(12,H*.8,25,'#0a0a18',.7); ridge(13,H*.88,50,'#050510',.5);
  (()=>{const ax=lerp(W*.15,W*.5,smooth(0,.25,p)); return figure(ax,ridgeY(13,H*.88,50,.5,false,ax)+4,150,lt,{col:'#030308',rim:'#9fb4ff',pose:p>.27?'arms':'staff',walk:p<.25?1:0});})();
  if(p>.62){ const q=smooth(.62,.8,p); X.globalAlpha=q; ridge(14,H*.9,20,'#1a0f06'); crowd(W*.05,W*.95,H*.93,40,lt,0,'#0a0610',14,70); X.globalAlpha=1; }
  particles('sparkle',lt,50,55,.7); },
c3(lt,d){ const p=lt/d;
  if(p<.3){ const q=p/.3; sky(['#2b0a05','#7a1e0c','#e2702c']); disc(W*.5,H*.62,90,'#ffb45a'); glow(W*.5,H*.62,400,'rgba(255,150,60,.7)');
    // pyramids
    X.fillStyle='#3a1608'; [[.2,200],[.42,280],[.8,230]].forEach(([k,h])=>{X.beginPath(); X.moveTo(W*k-h,H*.8); X.lineTo(W*k,H*.8-h); X.lineTo(W*k+h,H*.8); X.fill();});
    X.fillStyle='#1c0904'; X.fillRect(0,H*.8,W,H*.2);
    figure(lerp(W*.08,W*.36,smooth(0,.55,p/.3)),H*.86,150,lt,{col:'#0b0402',rim:'#ffcf8a',pose:'staff',walk:p/.3<.55?1:0}); figure(W*.64+Math.sin(lt*.6)*25,H*.86,170,lt,{col:'#0b0402',rim:'#ffcf8a',dir:Math.cos(lt*.6)>0?1:-1,pose:'point',walk:1});
    // pharaoh crown
    X.fillStyle='#0b0402'; X.beginPath(); X.moveTo(W*.64-12,H*.86-170*.92); X.lineTo(W*.64,H*.86-170*1.12); X.lineTo(W*.64+12,H*.86-170*.92); X.fill();
    particles('ember',lt,60,61,.8); }
  else if(p<.78){ const q=smooth(.3,.5,p); sky(['#060b1c','#132a52','#3a6aa0']); stars(120,62,lt,.5,H*.4);
    // pillar of fire
    const fx=W*.5; glow(fx,H*.2,260,'rgba(255,140,40,.8)'); X.globalCompositeOperation='lighter'; for(let i=0;i<40;i++){ glow(fx+Math.sin(lt*3+i)*18,H*.05+i*9,40,'rgba(255,'+(120+i*2)+',40,.35)'); } X.globalCompositeOperation='source-over';
    const gap=lerp(20,330,ease(q));
    // water walls
    for(const side of [-1,1]){ X.fillStyle=grad(['#0c3d6e','#1d6fb0','#0a2c52'],H*.1,H); X.beginPath(); const edge=W/2+side*gap; X.moveTo(side<0?-20:W+20,H*.05); for(let y=H*.05;y<=H;y+=12){ X.lineTo(edge+side*(Math.sin(y*.03+lt*4)*10+ (1-y/H)*40), y);} X.lineTo(side<0?-20:W+20,H); X.fill();
      X.strokeStyle='rgba(220,240,255,.55)'; X.lineWidth=3; X.beginPath(); for(let y=H*.05;y<=H;y+=12){ const xx=edge+side*(Math.sin(y*.03+lt*4)*10+(1-y/H)*40); y===H*.05?X.moveTo(xx,y):X.lineTo(xx,y);} X.stroke();
      for(let i=0;i<30;i++){ const yy=((lt*120+i*40)%H); glow(edge+side*(8+hash(i)*20),yy,10,'rgba(255,255,255,.5)'); } }
    X.fillStyle='#2a2216'; X.fillRect(W/2-gap,H*.82,gap*2,H*.2);
